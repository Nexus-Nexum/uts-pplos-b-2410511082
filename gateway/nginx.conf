server {
    listen 80;

    location /auth/ {
        proxy_pass http://auth-service:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 200 'Gateway Jalan! Coba pergi ke /auth/verify';
        add_header Content-Type text/plain;
    }
}