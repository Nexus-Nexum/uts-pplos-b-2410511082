version: '3.8'
services:
  gateway:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - service-2
      - service-3

  db-system:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"

  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3001"

  service-2:
    build: ./services/service-2
    ports:
      - "8001:80"

  service-3:
    build: ./services/service-3
    ports:
      - "3003:3003"