version: '3.8'

services:
  gateway:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service

  auth-service:
    build: ./services/auth-service
    ports:
      - "3001:3001"
    environment:
      - JWT_SECRET=

  service-2:
    build: ./services/service-2
    ports:
      - "8001:80"
  
  service-3:
    build: ./services/service-3

  db-auth:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_ROOT_PASSWORD: password

  db-donor:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: donor_db
      MYSQL_ROOT_PASSWORD: password